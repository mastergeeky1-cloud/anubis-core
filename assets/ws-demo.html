<!DOCTYPE html>
<html lang="en">
<!--
  ANUBIS WS demo — open this in a browser, then connect to the running
  anubis-core WS server (ws://localhost:7600/ws). Type a message and watch
  the LLM stream in live, then hear the TTS voice playback.
-->
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ANUBIS — Realtime AI Chat</title>
  <style>
    :root {
      --bg: #0b0e14;
      --panel: #141926;
      --accent: #7c5cff;
      --accent2: #22d3ee;
      --text: #e2e8f0;
      --muted: #64748b;
      --ok: #34d399;
      --err: #f87171;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(1200px 800px at 20% -10%, #1a1f3a, var(--bg));
      color: var(--text); min-height: 100vh;
    }
    header {
      padding: 20px 28px; display: flex; align-items: center; gap: 14px;
      border-bottom: 1px solid #1f2733;
    }
    header .logo { font-size: 26px; font-weight: 800; letter-spacing: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      -webkit-background-clip: text; background-clip: text; color: transparent; }
    .status { margin-left: auto; font-size: 13px; display: flex; gap: 8px;
      align-items: center; padding: 6px 12px; border-radius: 999px;
      background: var(--panel); border: 1px solid #1f2733; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
    .dot.on { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot.busy { background: var(--accent2); box-shadow: 0 0 8px var(--accent2); }

    main { max-width: 820px; margin: 0 auto; padding: 28px 20px 120px; }
    .chat { background: var(--panel); border-radius: 16px; padding: 20px;
      border: 1px solid #1f2733; min-height: 420px; }
    .msg { margin: 12px 0; max-width: 72%; padding: 12px 16px; border-radius: 14px;
      line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .msg.user { margin-left: auto; background: var(--accent); color: #fff;
      border-bottom-right-radius: 4px; }
    .msg.bot { background: #1d2536; border-bottom-left-radius: 4px; }
    .msg.bot .typing::after {
      content: "▋"; color: var(--accent2); animation: blink 1s steps(1) infinite; }
    .msg meta { display: block; font-size: 11px; color: var(--muted); margin-top: 6px; }
    @keyframes blink { 50% { opacity: 0; } }

    .bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 16px 24px;
      background: linear-gradient(0deg, var(--bg) 60%, transparent); }
    .bar form { max-width: 820px; margin: 0 auto; display: flex; gap: 10px; }
    input[type=text] {
      flex: 1; padding: 14px 18px; border-radius: 12px; border: 1px solid #2a3448;
      background: var(--panel); color: var(--text); font-size: 15px; outline: none; }
    input[type=text]:focus { border-color: var(--accent); }
    button { padding: 14px 22px; border-radius: 12px; border: 0; cursor: pointer;
      font-weight: 700; font-size: 15px; color: #fff;
      background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .quick { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
    .chip { background: var(--panel); border: 1px solid #2a3448; color: var(--muted);
      border-radius: 999px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    .chip:hover { color: var(--text); border-color: var(--accent); }
    .err { color: var(--err); font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">🔱 ANUBIS</div>
    <div class="status">
      <span class="dot" id="dot"></span>
      <span id="statusText">disconnected</span>
    </div>
  </header>
  <main>
    <div class="quick">
      <button class="chip" data-prompt="What is the meaning of life?">Meaning of life</button>
      <button class="chip" data-prompt="Tell me a short joke">Joke</button>
      <button class="chip" data-prompt="Explain quantum computing simply">Quantum computing</button>
    </div>
    <div class="chat" id="chat"></div>
    <div class="err" id="err"></div>
  </main>
  <div class="bar">
    <form id="form">
      <input type="text" id="input" placeholder="Message ANUBIS…" autocomplete="off" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script type="module">
    import { AnubisWS } from './anubis-ws-client.mjs';

    const chat = document.getElementById('chat');
    const dot = document.getElementById('dot');
    const statusText = document.getElementById('statusText');
    const errBox = document.getElementById('err');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const sendBtn = form.querySelector('button');

    const anubis = new AnubisWS('ws://localhost:7600/ws');

    function setStatus(label, cls) {
      dot.className = 'dot' + (cls ? ' ' + cls : '');
      statusText.textContent = label;
    }

    function addMsg(role, text) {
      const el = document.createElement('div');
      el.className = 'msg ' + role;
      el.textContent = text;
      el.dataset.role = role;
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
      return el;
    }
    // Current bot bubble we are streaming into.
    let botBubble = null;

    anubis.addEventListener('hello', () => setStatus('connected · v' + event.detail.version, 'on'));
    anubis.addEventListener('disconnect', () => { setStatus('disconnected'); setConnected(false); });
    anubis.addEventListener('status', (e) => {
      const s = e.detail.status;
      if (s === 'thinking') { setStatus('thinking…', 'busy'); }
      else if (s === 'synthesizing') { setStatus('speaking…', 'busy'); }
      else if (s === 'done') { setStatus('connected · speaking done', 'on'); }
    });
    anubis.addEventListener('text', (e) => {
      const t = e.detail || '';
      if (!botBubble) { botBubble = addMsg('bot', ''); }
      botBubble.textContent += t;
      chat.scrollTop = chat.scrollHeight;
    });
    anubis.addEventListener('textend', () => {
      setStatus('connected', 'on');
      botBubble = null;
      setConnected(true);
    });
    anubis.addEventListener('voice', () => { /* opus bytes — hook into an audio player here */ });
    anubis.addEventListener('error', (e) => {
      errBox.textContent = 'Error ' + e.detail.code + ': ' + e.detail.message;
      setStatus('connected', 'on');
      setConnected(true);
    });

    function setConnected(on) {
      input.disabled = !on;
      sendBtn.disabled = !on;
      if (on) input.focus();
    }

    // Auto-connect on load.
    setStatus('connecting…', 'busy');
    anubis.connect({ lang: 'en', voice: 'en_US-amy-medium' })
      .then(() => { errBox.textContent = ''; setConnected(true); })
      .catch((e) => { setStatus('connection failed'); errBox.textContent = e.message; });

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      addMsg('user', text);
      input.value = '';
      setConnected(false);
      setStatus('thinking…', 'busy');
      anubis.ask(text);
    });

    document.querySelectorAll('.chip').forEach((chip) => {
      chip.addEventListener('click', () => {
        input.value = chip.dataset.prompt;
        form.requestSubmit();
      });
    });
  </script>
</body>
</html>
