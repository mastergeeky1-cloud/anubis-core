[package]
name = "anubis"
version = "2.1.0"
edition = "2021"
description = "ANUBIS Core — local-first, open-source, bare-metal voice AI in Rust (Telegram bot + streaming WebSocket + Noxis Core + TTS + voice cloning)"
license = "MIT"
repository = "https://github.com/mastergeeky1-cloud/anubis-core"
readme = "README.md"
keywords = ["telegram", "voice", "tts", "ai", "bot", "webhook", "websocket"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "anubis"
path = "src/main.rs"

[dependencies]
# ── async runtime ──────────────────────────────────────────────────────────
tokio              = { version = "1",    features = ["full"] }
futures            = "0.3"

# ── telegram ───────────────────────────────────────────────────────────────
teloxide           = { version = "0.12", features = ["macros", "webhooks-axum"] }

# ── database (local SQLite, no external services) ───────────────────────────
rusqlite           = { version = "0.31", features = ["bundled"] }
r2d2               = "0.8"
r2d2_sqlite        = "0.24"

# ── serialisation ──────────────────────────────────────────────────────────
serde              = { version = "1",    features = ["derive"] }
serde_json         = "1"
toml               = "0.8"

# ── error handling ─────────────────────────────────────────────────────────
anyhow             = "1"
thiserror          = "2"

# ── http client (talks to LOCAL sidecars: llama.cpp, Chatterbox) ────────────
reqwest            = { version = "0.11", features = ["json", "multipart", "stream"] }
url                = "2"

# ── logging ────────────────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter"] }

# ── utilities ──────────────────────────────────────────────────────────────
uuid               = { version = "1",    features = ["v4"] }
async-trait        = "0.1"
dotenvy            = "0.15"
chrono             = "0.4"
bytes              = "1"

# ── concurrency ────────────────────────────────────────────────────────────
dashmap            = "6"

# ── caching ────────────────────────────────────────────────────────────────
lru                = "0.12"
xxhash-rust        = { version = "0.8", features = ["xxh64"] }

# ── audio (pure-Rust WAV I/O + effects) ───────────────────────────────────
hound              = "3.5"

# ── real-time WebSocket transport (opcode protocol) ─────────────────────────
axum              = { version = "0.7", features = ["ws"] }

[profile.release]
opt-level     = 3
lto           = true
codegen-units = 1
strip         = true
